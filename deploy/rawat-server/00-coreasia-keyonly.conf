# /etc/ssh/sshd_config.d/00-coreasia-keyonly.conf
# Login SSH hanya dengan kunci. Berkas ini sengaja bernomor 00: sshd memakai nilai PERTAMA yang ditemukan,
# sedangkan 50-cloud-init.conf bawaan image berisi "PasswordAuthentication yes".
# Selalu periksa hasil akhirnya dengan `sudo sshd -T`, bukan isi berkas.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
