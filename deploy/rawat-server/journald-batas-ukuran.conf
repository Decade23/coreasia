# /etc/systemd/journald.conf.d/batas-ukuran.conf
# Disk VPS kita 19 GB. Tanpa batas, journal bisa tumbuh sampai gigabyte dan membuat cadangan menolak jalan.
# Sesuaikan SystemKeepFree dengan ruang yang dibutuhkan skrip cadangan di server itu.
[Journal]
SystemMaxUse=300M
SystemKeepFree=2G
MaxRetentionSec=3month
